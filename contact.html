<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finverse | Contact</title>
    <link rel="stylesheet" href="contact.css"> 
    <!-- Use a separate CSS file for this page -->
</head>
<body>

    <!-- HEADER -->
    <header class="contact-header">
        <h1 class="contact-title">Get in Touch</h1>
        <p class="contact-subtitle">We’re here to help you manage your finances better.</p>
    </header>

    <!-- CONTACT FORM SECTION -->
    <section class="contact-section-box">
        <form class="contact-form-box">

            <label for="username">Your Name</label>
            <input type="text" id="username" placeholder="Enter your name">

            <label for="useremail">Your Email</label>
            <input type="email" id="useremail" placeholder="Enter your email">

            <label for="usermessage">Message</label>
            <textarea id="usermessage" rows="5" placeholder="Write your message"></textarea>

            <button type="submit" class="contact-btn-send">Send Message</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer class="contact-footer">
        <p>© 2025 Finverse | All Rights Reserved</p>
    </footer>

</body>
</html>
